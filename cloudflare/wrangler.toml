name = "jaundice-monitor"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Static dashboard assets — Worker handles /api/* first
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# KV for reading history — create once, then paste the id below:
#   npx wrangler kv namespace create READINGS
#   npx wrangler kv namespace create READINGS --preview
# Local `wrangler dev` works with placeholder ids; replace before `deploy`.
[[kv_namespaces]]
binding = "READINGS"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
# Change this before deploying. ESP32 must send the same value in X-API-Key.
API_KEY = "jaundice-demo-key-change-me"
DEVICE_TIMEOUT_MS = "30000"
MAX_READINGS = "200"
